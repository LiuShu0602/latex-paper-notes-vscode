name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install playwright
      - run: python -m playwright install chromium
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:webview
      - run: npm run test:integration
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: latex-paper-notes-vsix
          path: latex-paper-notes-*.vsix

  miktex-example:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install MiKTeX
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $miktexInstalled = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install miktex --yes --no-progress
            if ($LASTEXITCODE -eq 0) {
              $miktexInstalled = $true
              break
            }
            Write-Warning "MiKTeX download attempt $attempt failed with exit code $LASTEXITCODE."
            if ($attempt -lt 3) {
              Start-Sleep -Seconds (15 * $attempt)
            }
          }
          if (-not $miktexInstalled) {
            throw 'MiKTeX installation failed after three attempts.'
          }
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          $miktexBin = Split-Path -Parent (Get-Command initexmf -ErrorAction Stop).Source
          $miktexBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          initexmf --admin --update-fndb
          if ($LASTEXITCODE -ne 0) { throw "initexmf failed with exit code $LASTEXITCODE" }
          mpm --admin --update-db
          if ($LASTEXITCODE -ne 0) { throw "mpm database update failed with exit code $LASTEXITCODE" }
          $packages = @('ctex', 'fandol', 'tcolorbox', 'imakeidx', 'hyperref')
          foreach ($packageName in $packages) {
            mpm --admin "--install=$packageName"
            if ($LASTEXITCODE -ne 0) {
              throw "MiKTeX package installation failed for $packageName with exit code $LASTEXITCODE"
            }
          }
      - run: npm ci
      - name: Exercise the built-in build without latexmk or Perl
        shell: powershell
        run: |
          $env:PAPER_NOTES_DIRECT_BUILD = '1'
          $env:PAPER_NOTES_TEST_LOG = '1'
          npm run test:integration
      - name: Build the sanitized multi-file example
        shell: powershell
        run: |
          .\scripts\build-example.ps1
          npm run test:latex-render
