name: Release VSIX

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install playwright
      - run: python -m playwright install chromium
      - run: npm run package
      - name: Create SHA-256 file
        shell: powershell
        run: |
          $vsix = Get-ChildItem latex-paper-notes-*.vsix | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $vsix.FullName).Hash.ToLowerInvariant()
          "$hash  $($vsix.Name)" | Set-Content -Encoding ascii "$($vsix.FullName).sha256"
      - name: Publish GitHub Release assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:RELEASE_TAG" latex-paper-notes-*.vsix latex-paper-notes-*.vsix.sha256 --clobber
